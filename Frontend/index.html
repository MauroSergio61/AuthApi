<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Auth API Dashboard</h1>

    <div class="card">
        <h2>Register</h2>
        <input id="reg-username" type="text" placeholder="Username">
        <input id="reg-password" type="password" placeholder="Password">
        <button onclick="registerUser()">Register</button>
        <p id="reg-response" class="response"></p>
    </div>

    <div class="card">
        <h2>Login</h2>
        <input id="login-username" type="text" placeholder="Username">
        <input id="login-password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="login-response" class="response"></p>
    </div>

    <div class="card">
        <h2>Validate Token</h2>
        <input id="validate-token" type="text" placeholder="Paste JWT Token">
        <button onclick="validateToken()">Validate</button>
        <p id="validate-response" class="response"></p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
